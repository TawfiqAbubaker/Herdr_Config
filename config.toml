[keys]
prefix = "ctrl+a"
next_agent = "prefix+m"
previous_agent = "prefix+shift+m"
rename_tab = "prefix+shift+t"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[theme]
name = "catppuccin"
auto_switch = false

